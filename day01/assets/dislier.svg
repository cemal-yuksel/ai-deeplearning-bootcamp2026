<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070B1F"/><stop offset="0.6" stop-color="#120F35"/><stop offset="1" stop-color="#1E0A33"/></linearGradient>
  <radialGradient id="glow" cx="0.85" cy="0.45" r="0.5"><stop offset="0" stop-color="#FB7185" stop-opacity="0.42"/><stop offset="1" stop-color="#FB7185" stop-opacity="0"/></radialGradient>
  <radialGradient id="glow2" cx="0.05" cy="1" r="0.45"><stop offset="0" stop-color="#7C3AED" stop-opacity="0.35"/><stop offset="1" stop-color="#7C3AED" stop-opacity="0"/></radialGradient>
  <linearGradient id="vurgu" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#FB7185"/></linearGradient>
  <linearGradient id="isik" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/><stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.07"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient>
  <pattern id="izgara" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0 L0 0 0 40" fill="none" stroke="#FFFFFF" stroke-opacity="0.035"/></pattern>
  <filter id="parilti" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="yumusak" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="16"/></filter>
</defs>
<rect width="1200" height="420" rx="26" fill="url(#bg)"/>
<rect width="1200" height="420" rx="26" fill="url(#izgara)"/>
<rect width="1200" height="420" rx="26" fill="url(#glow)"/>
<rect width="1200" height="420" rx="26" fill="url(#glow2)"/>
<g><circle cx="250" cy="210" r="90" fill="#0F1535" stroke="#A78BFA" stroke-width="9" stroke-dasharray="14 9" filter="url(#parilti)"/><circle cx="250" cy="210" r="74" fill="none" stroke="#A78BFA" stroke-opacity="0.4" stroke-width="2"/><line x1="250" y1="210" x2="250" y2="132" stroke="#A78BFA" stroke-width="5" stroke-linecap="round"/><animateTransform attributeName="transform" type="rotate" from="0 250 210" to="360 250 210" dur="8s" repeatCount="indefinite"/></g>
<text x="250" y="222" text-anchor="middle" font-size="34" font-weight="800" fill="#F8FAFC"  >×2</text>
<g><circle cx="500" cy="210" r="62" fill="#0F1535" stroke="#22D3EE" stroke-width="9" stroke-dasharray="14 9" filter="url(#parilti)"/><circle cx="500" cy="210" r="46" fill="none" stroke="#22D3EE" stroke-opacity="0.4" stroke-width="2"/><line x1="500" y1="210" x2="500" y2="160" stroke="#22D3EE" stroke-width="5" stroke-linecap="round"/><animateTransform attributeName="transform" type="rotate" from="0 500 210" to="-360 500 210" dur="5.5s" repeatCount="indefinite"/></g>
<text x="500" y="222" text-anchor="middle" font-size="34" font-weight="800" fill="#F8FAFC"  >×½</text>
<g><circle cx="702" cy="210" r="80" fill="#0F1535" stroke="#FBBF24" stroke-width="9" stroke-dasharray="14 9" filter="url(#parilti)"/><circle cx="702" cy="210" r="64" fill="none" stroke="#FBBF24" stroke-opacity="0.4" stroke-width="2"/><line x1="702" y1="210" x2="702" y2="142" stroke="#FBBF24" stroke-width="5" stroke-linecap="round"/><animateTransform attributeName="transform" type="rotate" from="0 702 210" to="360 702 210" dur="7s" repeatCount="indefinite"/></g>
<text x="702" y="222" text-anchor="middle" font-size="34" font-weight="800" fill="#F8FAFC"  >×3</text>
<text x="250" y="340" text-anchor="middle" font-size="20" font-weight="700" fill="#A78BFA"  >∂z/∂w</text>
<text x="500" y="340" text-anchor="middle" font-size="20" font-weight="700" fill="#22D3EE"  >∂ŷ/∂z</text>
<text x="702" y="340" text-anchor="middle" font-size="20" font-weight="700" fill="#FBBF24"  >∂L/∂ŷ</text>
<rect x="880" y="130" width="270" height="160" rx="22" fill="#0F1535" stroke="#FB7185" stroke-width="2.5" filter="url(#parilti)"/>
<text x="1015" y="178" text-anchor="middle" font-size="17" font-weight="600" fill="#CBD5E1"  >Son dişli ne kadar döner?</text>
<text x="1015" y="226" text-anchor="middle" font-size="34" font-weight="800" fill="#F8FAFC"  >2 × ½ × 3 = 3</text>
<text x="1015" y="264" text-anchor="middle" font-size="17" font-weight="700" fill="#FB7185"  >oranlar çarpılır</text>
<text x="600" y="392" text-anchor="middle" font-size="19" font-weight="600" fill="#CBD5E1" font-style="italic" >Zincir kuralı = dişli kutusu: toplam etki, halkaların etkilerinin çarpımıdır.</text>
<text x="600" y="70" text-anchor="middle" font-size="18" font-weight="800" fill="#FB7185" letter-spacing="5" >ZİNCİR KURALI BENZETMESİ  ·  DİŞLİ KUTUSU</text>
<rect x="1" y="1" width="1198" height="418" rx="26" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="2"/>
