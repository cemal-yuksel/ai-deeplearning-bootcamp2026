<text x="60" y="100" font-size="18" font-weight="500" fill="#CBD5E1" font-style="italic" >Üç adım: ① ham skorlar (logit) → ② e^x ile hepsini pozitif yap → ③ toplama böl. Sonuçta hepsi 0–1 arası ve toplam = 1</text><rect x="40" y="130" width="480" height="440" rx="18" fill="#0F1535" fill-opacity="0.85" stroke="#22D3EE" stroke-width="1.6" /><text x="66" y="168" font-size="20" font-weight="800" fill="#22D3EE" >① Ham skorlar (logit)</text><rect x="560" y="130" width="480" height="440" rx="18" fill="#0F1535" fill-opacity="0.85" stroke="#FBBF24" stroke-width="1.6" /><text x="586" y="168" font-size="20" font-weight="800" fill="#FBBF24" >② e^x: hepsi pozitif olsun</text><rect x="1080" y="130" width="480" height="440" rx="18" fill="#0F1535" fill-opacity="0.85" stroke="#34D399" stroke-width="1.6" /><text x="1106" y="168" font-size="20" font-weight="800" fill="#34D399" >③ Toplama böl → olasılık</text><text x="540" y="360" text-anchor="middle" font-size="40" fill="#CBD5E1" opacity="0.8">›</text><text x="1060" y="360" text-anchor="middle" font-size="40" fill="#CBD5E1" opacity="0.8">›</text><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.000;0.050;0.94;1" dur="13s" repeatCount="indefinite"/><line x1="70" y1="410" x2="490" y2="410" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="2"/><rect x="73.0" y="410" width="74" height="0" rx="8" fill="#FB7185" filter="url(#parilti2)"><animate attributeName="height" values="0;0;30.0;30.0" keyTimes="0;0.020;0.120;1" dur="13s" repeatCount="indefinite"/></rect><text x="110" y="462" font-size="22" font-weight="800" fill="#FB7185" text-anchor="middle" >−1</text><rect x="186.0" y="410" width="74" height="0" rx="8" fill="#22D3EE" filter="url(#parilti2)"><animate attributeName="height" values="0;0;3.0;3.0" keyTimes="0;0.020;0.120;1" dur="13s" repeatCount="indefinite"/><animate attributeName="y" values="410;410;407.0;407.0" keyTimes="0;0.020;0.120;1" dur="13s" repeatCount="indefinite"/></rect><text x="223" y="395" f